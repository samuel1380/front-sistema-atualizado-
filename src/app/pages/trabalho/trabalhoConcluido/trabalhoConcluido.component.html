<div class="listaTrabalhos">
  <!-- Barra de Ações e Informações do Topo -->
  <mat-card class="mb-20 tagus-card">
    <mat-card-content class="d-flex justify-content-between align-items-center flex-wrap gap-3 py-2">
      <div class="flex-grow-1" style="min-width: 250px;">
        <h4 class="mb-1 fw-bold text-dark">Trabalhos Concluídos</h4>
        <small class="text-muted d-flex align-items-center flex-wrap gap-1" style="font-size: 13px; line-height: 1.4;">
          <mat-icon style="font-size: 17px; height: 17px; width: 17px; color: #1976d2; flex-shrink: 0;">info</mat-icon>
          <span>Use o botão <mat-icon style="font-size: 16px; height: 16px; width: 16px; color: #e53935; vertical-align: middle;">visibility_off</mat-icon> em um trabalho para tirá-lo desta tela (ele não é apagado).</span>
        </small>
      </div>
      <div class="mt-2 mt-md-0">
        <mat-slide-toggle [checked]="mostrarOcultos" (change)="toggleMostrarOcultos()" color="primary">
          Exibir trabalhos tirados da tela
        </mat-slide-toggle>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Barra de Filtro Rápido de Status (Scroll Horizontal Touch no Mobile) -->
  <div class="status-filter-wrapper">
    <div class="status-filter-chips">
      <!-- Opção: Apenas com Trabalhos -->
      <button 
        type="button" 
        class="chip-filter-btn"
        [class.active]="selectedStatus === 'COM_TRABALHO'"
        (click)="selecionarStatus('COM_TRABALHO')">
        <mat-icon class="chip-icon">filter_list</mat-icon>
        <span>Com Trabalhos</span>
        <span class="chip-badge" *ngIf="totalGeral > 0">{{ totalGeral }}</span>
      </button>

      <!-- Opção: Todos os Status -->
      <button 
        type="button" 
        class="chip-filter-btn"
        [class.active]="selectedStatus === 'TODOS'"
        (click)="selecionarStatus('TODOS')">
        <span>Todos</span>
        <span class="chip-badge">{{ totalGeral }}</span>
      </button>

      <!-- Chips individuais -->
      <button 
        type="button" 
        class="chip-filter-btn"
        *ngFor="let s of statuses"
        [class.active]="selectedStatus === s.key"
        [class.has-items]="(statusCounts[s.key] || 0) > 0"
        (click)="selecionarStatus(s.key)">
        <span>{{ s.label }}</span>
        <span class="chip-badge" [class.badge-zero]="!(statusCounts[s.key] > 0)">
          {{ statusCounts[s.key] !== undefined ? statusCounts[s.key] : '-' }}
        </span>
      </button>
    </div>
  </div>

  <!-- Estado vazio quando não houver nenhum trabalho concluído na visão filtrada -->
  <mat-card class="mb-25 tagus-card empty-dashboard-card" *ngIf="selectedStatus === 'COM_TRABALHO' && totalGeral === 0 && totalStatusComTrabalhos === 0">
    <mat-card-content class="text-center py-4">
      <mat-icon class="empty-dashboard-icon">done_all</mat-icon>
      <h5 class="mt-2 mb-1">Nenhum trabalho concluído nesta visualização</h5>
      <p class="text-muted mb-0">Toque em "Todos" ou ative o filtro acima para ver os trabalhos.</p>
    </mat-card-content>
  </mat-card>

  <mat-card class="mb-25 tagus-card filaEspera" *ngIf="!(selectedStatus === 'COM_TRABALHO' && totalGeral === 0 && totalStatusComTrabalhos === 0)">
    <mat-card-content>
      <div 
        *ngFor="let s of statuses"
        class="status-group-item"
        [style.display]="deveExibirStatus(s.key) ? 'block' : 'none'">
        <app-trabalho-lista-trabalho 
          [statusTrabalho]="[s.key]" 
          [incluirOcultos]="mostrarOcultos"
          (totalTrabalhos)="onTotalTrabalhos(s.key, $event)">
        </app-trabalho-lista-trabalho>
      </div>
    </mat-card-content>
  </mat-card>
</div>
